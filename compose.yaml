services:
  mod-platform:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      PUBLIC_CDN_URL: ${PUBLIC_CDN_URL:-}
      PUBLIC_LAUNCHER_URL: ${PUBLIC_LAUNCHER_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      ALLOW_BOOTSTRAP_ADMIN: ${ALLOW_BOOTSTRAP_ADMIN:-false}
      SIGNING_PRIVATE_KEY: ${SIGNING_PRIVATE_KEY:-}
      SIGNING_SERVICE_URL: ${SIGNING_SERVICE_URL:-}
      SIGNING_SERVICE_TOKEN: ${SIGNING_SERVICE_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      MAX_ARTIFACT_BYTES: ${MAX_ARTIFACT_BYTES:-2147483648}
      MAX_DIAGNOSTIC_BYTES: ${MAX_DIAGNOSTIC_BYTES:-262144}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      ADMIN_HOST: ${ADMIN_HOST:-}
      REQUIRE_REVIEW: ${REQUIRE_REVIEW:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-objects/}
      CDN_STYLE: ${CDN_STYLE:-origin}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - mod-platform-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    profiles: ["full"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: modplatform
      POSTGRES_USER: modplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - mod-platform-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modplatform -d modplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["full"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-modplatform}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - mod-platform-minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  mod-platform-data:
  mod-platform-pg:
  mod-platform-minio:
