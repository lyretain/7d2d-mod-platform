name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: fail closed
        if: failure()
        run: |
          echo "Tests failed; do not publish a production release."
          exit 1

  mod-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          extract_json() {
            node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(value.pluginVersion || ''))" "$1"
          }
          extract_xml() {
            grep -oE 'Version value="[^"]+"' "$1" | head -n 1
          }
          current="$(extract_json project-versions.json)"
          if [ -z "$current" ]; then
            echo "Could not read pluginVersion from project-versions.json"
            exit 1
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: publishing plugin $current"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No parent commit: publishing plugin $current"
            exit 0
          fi
          prev="$(git show HEAD^:project-versions.json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).pluginVersion||""))}catch{}})' || true)"
          client_now="$(extract_xml plugins/client/ModInfo.xml)"
          server_now="$(extract_xml plugins/server/ModInfo.xml)"
          client_prev="$(git show HEAD^:plugins/client/ModInfo.xml 2>/dev/null | grep -oE 'Version value="[^"]+"' | head -n 1 || true)"
          server_prev="$(git show HEAD^:plugins/server/ModInfo.xml 2>/dev/null | grep -oE 'Version value="[^"]+"' | head -n 1 || true)"
          if [ "$current" != "$prev" ] || [ "$client_now" != "$client_prev" ] || [ "$server_now" != "$server_prev" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Plugin version changed: ${prev:-none} -> $current"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Plugin version unchanged ($current); skipping Windows publish."
          fi

  publish:
    needs: [test, mod-version]
    if: needs.mod-version.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      PLATFORM_BASE_URL: ${{ secrets.PLATFORM_BASE_URL }}
      PLATFORM_TOKEN: ${{ secrets.PLATFORM_TOKEN }}
      PLATFORM_USERNAME: ${{ secrets.PLATFORM_USERNAME }}
      PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}
      PLATFORM_PACK_ID: ${{ vars.PLATFORM_PACK_ID }}
      PLATFORM_PACK_NAME: ${{ vars.PLATFORM_PACK_NAME }}
      PLATFORM_GAME_VERSION: ${{ vars.PLATFORM_GAME_VERSION }}
      PLATFORM_PUBLISH_LAUNCHER: ${{ vars.PLATFORM_PUBLISH_LAUNCHER }}
      PLATFORM_ORIGIN_IP: ${{ vars.PLATFORM_ORIGIN_IP }}
      PLATFORM_ORIGIN_SCHEME: ${{ vars.PLATFORM_ORIGIN_SCHEME }}
      PLATFORM_ORIGIN_PORT: ${{ vars.PLATFORM_ORIGIN_PORT }}
      PLATFORM_PUBLIC_HOST: ${{ vars.PLATFORM_PUBLIC_HOST }}
      PLATFORM_ORIGIN_INSECURE: ${{ vars.PLATFORM_ORIGIN_INSECURE }}
      GAME_MANAGED_URL: ${{ secrets.GAME_MANAGED_URL }}
      PLATFORM_CF_SKIP_TOKEN: ${{ secrets.PLATFORM_CF_SKIP_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache 7DTD managed references
        uses: actions/cache@v4
        with:
          path: .ci/7dtd-managed
          key: 7dtd-managed-${{ vars.STEAM_BUILD_ID || '24436778' }}
      - name: Fetch game references
        shell: pwsh
        run: |
          ./deploy/fetch-game-managed.ps1 -OutDir ".ci/7dtd-managed" -SteamBuildId "${{ vars.STEAM_BUILD_ID || '24436778' }}"
      - name: Build plugins
        shell: pwsh
        run: |
          ./deploy/build-plugins.ps1 `
            -GameManagedDir (Resolve-Path ".ci/7dtd-managed").Path `
            -GameVersion "${{ vars.PLATFORM_GAME_VERSION || '3.1.0' }}" `
            -SteamBuildId "${{ vars.STEAM_BUILD_ID || '24436778' }}"
      - name: Build launcher
        shell: pwsh
        run: ./deploy/build-launcher.ps1
      - name: Pack plugin zips
        shell: pwsh
        run: node deploy/publish-platform.js --pack-only
      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hordepin-platform-${{ github.sha }}
          path: |
            artifacts/plugins/**
            artifacts/*.zip
            artifacts/launcher/**
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $zips = @(Get-ChildItem -Path artifacts -File | Where-Object {
            $_.Name -match '^ModPlatform(Client|Server)-.+\.zip$'
          })
          if (-not $zips.Count) { throw "No plugin ZIP was packed." }
          $files = @($zips | ForEach-Object { $_.FullName })
          $tag = "v${{ needs.mod-version.outputs.version }}"
          $title = "Hordepin mods ${{ needs.mod-version.outputs.version }}"
          $notes = @(
            'Official 7 Days to Die client and server plugin mods.',
            '',
            "- Version: ${{ needs.mod-version.outputs.version }}",
            "- Commit: ${{ github.sha }}",
            "- Game: ${{ vars.PLATFORM_GAME_VERSION || '3.1.0' }} (Steam ${{ vars.STEAM_BUILD_ID || '24436778' }})",
            '- Extract ModPlatformClient into %APPDATA%\7DaysToDie\Mods\',
            '- Extract ModPlatformServer into the dedicated server Mods folder',
            '- Launcher builds are published to the management platform, not this Release'
          ) -join "`n"
          gh release view $tag *>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --title $title --notes $notes --latest
          } else {
            gh release create $tag @files --title $title --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release failed." }
      - name: Publish to management platform
        shell: pwsh
        run: |
          if (-not $env:PLATFORM_TOKEN -and -not ($env:PLATFORM_USERNAME -and $env:PLATFORM_PASSWORD)) {
            Write-Host "Skipping platform upload: set PLATFORM_TOKEN or PLATFORM_USERNAME/PASSWORD repository secrets."
            exit 0
          }
          if (-not $env:PLATFORM_BASE_URL) { $env:PLATFORM_BASE_URL = "https://mods.aic.la" }
          node deploy/publish-platform.js
