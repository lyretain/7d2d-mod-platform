# Ubuntu: /etc/nginx/sites-available/mod-platform
# CentOS 系: /etc/nginx/conf.d/mod-platform.conf
# 把 mods.aic.la 换成实际域名。证书由 certbot 或宝塔写入后，可再拆 443 server。

upstream mod_platform {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mods.aic.la;

    client_max_body_size 2048m;
    client_body_timeout 600s;

    # 申请到证书后，certbot 通常会改成跳转 HTTPS。未上证书前可先这样反代。
    location / {
        proxy_pass http://mod_platform;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        autoindex off;
    }

    location = /admin-i18n.js {
        proxy_pass http://mod_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        proxy_pass http://mod_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /api/v1/auth/ {
        proxy_pass http://mod_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/v1/admin/ {
        proxy_pass http://mod_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store";
    }
}
